<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // Get the current path and redirect to index.html with the path as a hash
      const path = window.location.pathname + window.location.search;
      window.location.href = "/euphoric/index.html" + path;
    </script>
    <meta http-equiv="refresh" content="0; URL='/euphoric/index.html'" />
  </head>
  <body>
    <p>
      If you are not redirected, <a href="/euphoric/index.html">click here</a>.
    </p>
  </body>
</html>
